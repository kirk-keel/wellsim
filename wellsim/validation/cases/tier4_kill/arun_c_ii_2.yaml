# Mobil Arun C-II-2 Dynamic Kill Benchmark Case
# Source: Blount & Soeiinah (1981), World Oil; Upchurch et al. (2017) SPE-174890
name: arun_c_ii_2_kill
description: Historical Arun gas blowout dynamic kill via relief well injection.
reservoir:
  pressure: 7100 psia
  temperature: 350 degF
  depth_md: 10000 ft
  datum_tvd: 10000 ft
  net_pay: 200 ft
  permeability: 50 md
  wellbore_radius: 0.354 ft
  drainage_radius: 2500 ft
  skin: 0.0
fluid:
  type: dry_gas
  gas_sg: 0.65
well:
  total_depth_md: 10000 ft
  survey:
    - {md: 0, tvd: 0}
    - {md: 10000, tvd: 10000}
  hole:
    - {top_md: 0, bottom_md: 10000, id: 7.0, kind: casing}
flow_path: no_string
temperature:
  model: adiabatic
kill:
  injection_depth_md: 9500 ft
  kill_fluid_density: 10.5 ppg
  rheology: {type: newtonian, viscosity: 1.0 cp}
  injection_path:
    type: relief_well
    sections:
      - {length: 9800 ft, id: 4.276 in}
  pump_pressure_limit: 10000 psi
  available_hhp: 8000 hp
