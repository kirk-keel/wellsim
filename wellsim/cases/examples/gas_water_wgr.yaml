# M3-3 example: 6 in vertical gas well producing water at a fixed water-gas ratio.
# Numbers are illustrative, not a validation case.
name: gas_water_wgr
description: 6 in vertical gas well, 10,000 ft, water at 20 bbl/MMscf; gas-liquid nodal solve.
reservoir:
  pressure: 5000
  temperature: 180
  depth_md: 10000
  net_pay: 50
  permeability: 100
  wellbore_radius: 0.354
  drainage_radius: 1500
  skin: 0.0
fluid:
  type: dry_gas
  gas_sg: 0.65
liquid:
  rho_l: 8.33        # ppg (water)
  mu_l: 1.0          # cp
  cp_l: 1.0          # Btu/(lbm degF)
  sigma: 60.0        # dyne/cm
  c_l: 4900.0        # ft/s
liquid_inflow:
  mode: wgr
  water_gas_ratio: 20.0   # bbl/MMscf
well:
  total_depth_md: 10000
  hole:
    - {top_md: 0, bottom_md: 10000, id: 6.0, kind: casing}
flow_path: no_string
exit:
  ambient_pressure: 14.7
