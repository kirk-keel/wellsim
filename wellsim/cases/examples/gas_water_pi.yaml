# M3-3 example: 6 in vertical gas well with a liquid productivity index.
# Numbers are illustrative, not a validation case.
name: gas_water_pi
description: 6 in vertical gas well, 10,000 ft, p_r 4,000 psia, water J = 2 stb/d/psi; gas-liquid nodal solve.
reservoir:
  pressure: 4000
  temperature: 180
  depth_md: 10000
  net_pay: 50
  permeability: 100
  wellbore_radius: 0.354
  drainage_radius: 1500
  skin: 0.0
fluid:
  type: dry_gas
  gas_sg: 0.65
liquid:
  rho_l: 8.33
  mu_l: 1.0
  cp_l: 1.0
  sigma: 60.0
  c_l: 4900.0
liquid_inflow:
  mode: pi
  productivity_index: 2.0   # stb/d per psi of drawdown
well:
  total_depth_md: 10000
  hole:
    - {top_md: 0, bottom_md: 10000, id: 6.0, kind: casing}
flow_path: no_string
exit:
  ambient_pressure: 14.7
